  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body.is-loading {
      overflow: hidden;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-color, #f5efe6);
      z-index: 9999;
      transition: opacity 0.5s ease-in-out;
    }

    #initial-loader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #initial-loader .loader-glow {
      position: absolute;
      width: 175px;
      height: 175px;
      border-radius: 50%;
      background: radial-gradient(circle, #cf735e 0%, transparent 70%);
      opacity: 0.4;
      animation: page-loader-pulse 1.8s ease-in-out infinite;
      transition: 250ms;
    }

    #initial-loader .loader-icon {
      position: relative;
      z-index: 1;
      width: 80px;
      height: 80px;
      will-change: transform;
      transform: scale(0.4) rotate(-90deg);
      animation: loader-spin 1.8s ease-in-out infinite;

    }

    @keyframes loader-spin {
      0% {
        transform: rotate(0deg) scale(0.8);
      }

      25% {
        transform: rotate(90deg) scale(1.15);
      }

      50% {
        transform: rotate(180deg) scale(0.8);
      }

      75% {
        transform: rotate(270deg) scale(1.15);
      }

      100% {
        transform: rotate(360deg) scale(0.8);
      }
    }

    @keyframes page-loader-pulse {

      0%,
      100% {
        transform: scale(0.9);
        opacity: 0.25;
      }

      50% {
        transform: scale(1.15);
        opacity: 0.45;
      }
    }


    @media (prefers-reduced-motion: reduce) {
      #initial-loader .loader-icon {
        animation: none !important;
      }

      #initial-loader .loader-glow {
        animation: none;
        opacity: 0.3;
      }
    }

    html.dark #initial-loader {
      background: var(--bg-color, #201a12);
    }
  </style>

  <script>
    (function () {
      try {
        if (localStorage.getItem("darkMode") === "true") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) { }
    })();
  </script>
</head>

<body class="is-loading">
  <div id="root"></div>

  <div id="initial-loader" aria-hidden="true">
    <div class="loader-glow"></div>
    <img id="initial-loader-icon" class="loader-icon" src="/sun-2.svg" alt="" />
  </div>

  <script>
    (function () {
      try {
        if (localStorage.getItem("darkMode") === "true") {
          document.getElementById("initial-loader-icon").src = "/moon.svg";
        }
      } catch (e) { }
    })();
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
